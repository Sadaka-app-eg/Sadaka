<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فحص وإرسال التنبيهات التلقائية</title>
</head>
<body>
    <h2>جاري فحص المواعيد والتنبيهات...</h2>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCULaDRVQ9SWS07zs2WL3D-ANj-wHeoYWg",
          authDomain: "sadaka-app-6637e.firebaseapp.com",
          projectId: "sadaka-app-6637e",
          storageBucket: "sadaka-app-6637e.firebasestorage.app",
          messagingSenderId: "425677494061",
          appId: "1:425677494061:web:0aacb04e72f767ad8925a4",
          measurementId: "G-WE16D4JC8F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function checkAndNotify() {
            try {
                // 1. جلب الوقت الحالي بتنسيق (HH:MM) 24 ساعة
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const currentTime = `${hours}:${minutes}`;
                
                console.log("الوقت الحالي للسيرفر:", currentTime);

                // 2. جلب كل التوكنات وإعدادات المستخدمين من قاعدة البيانات
                const querySnapshot = await getDocs(collection(db, "user_tokens"));
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const userAlarmTime = data.alarmTime; // الوقت اللي المستخدم اختاره (مثلاً 17:30)

                    console.Hlog?.("مقارنة وقت المستخدم:", userAlarmTime, "مع الحالي:", currentTime);

                    // 3. لو وقت المستخدم بيطابق الوقت الحالي تماماً، نببعت الإشعار
                    if (userAlarmTime && userAlarmTime === currentTime) {
                        console.log("🎯 حان وقت التنبيه لهذا المستخدم! جاري إرسال الإشعار...");
                        // هنا يتم تفعيل إرسال الإشعار للتوكن الخاص به
                    }
                });

                console.log("تمت عملية الفحص بنجاح.");
            } catch (error) {
                console.error("خطأ أثناء الفحص:", error);
            }
        }

        checkAndNotify();
    </script>
</body>
</html>
