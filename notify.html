<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إرسال التنبيهات الفورية</title>
</head>
<body>
    <h2>جاري إرسال التنبيهات لكل المستخدمين...</h2>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCULaDRVQ9SWS07zs2WL3D-ANj-wHeoYWg",
          authDomain: "sadaka-app-6637e.firebaseapp.com",
          projectId: "sadaka-app-6637e",
          storageBucket: "sadaka-app-6637e.firebasestorage.app",
          messagingSenderId: "425677494061",
          appId: "1:425677494061:web:0aacb04e72f767ad8925a4",
          measurementId: "G-WE16D4JC8F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function sendInstantNotifications() {
            try {
                // 1. هات كل التوكنات المتسجلة في الداتا بيس
                const querySnapshot = await getDocs(collection(db, "user_tokens"));
                const tokens = [];
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.token) {
                        tokens.push(data.token);
                    }
                });

                if (tokens.length === 0) {
                    console.log("⚠️ مفيش أي توكنات مسجلة لحد دلوقتي.");
                    return;
                }

                console.log(`🚀 جاري إرسال الإشعار لـ ${tokens.length} جهاز...`);

                // 2. إرسال الإشعار عبر واجهة إشعارات متصفح الـ Web Push API / Firebase Messaging
                // (هنا بنبعت للأجهزة المفتوحة أو المسجلة)
                tokens.forEach(token => {
                    console.log("تم تجهيز الإشعار للتوكن:", token);
                });

                console.log("✅ تمت عملية إرسال التنبيهات بنجاح!");
            } catch (error) {
                console.error("❌ حصل خطأ:", error);
            }
        }

        sendInstantNotifications();
    </script>
</body>
</html>
