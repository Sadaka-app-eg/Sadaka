<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إرسال التنبيه التلقائي</title>
</head>
<body>
    <h2>جاري إرسال التنبيه...</h2>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCULaDRVQ9SWS07zs2WL3D-ANj-wHeoYWg",
          authDomain: "sadaka-app-6637e.firebaseapp.com",
          projectId: "sadaka-app-6637e",
          storageBucket: "sadaka-app-6637e.firebasestorage.app",
          messagingSenderId: "425677494061",
          appId: "1:425677494061:web:0aacb04e72f767ad8925a4",
          measurementId: "G-WE16D4JC8F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function triggerAutoNotification() {
            try {
                const querySnapshot = await getDocs(collection(db, "user_tokens"));
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    console.log("تم العثور على توكن للجهاز:", data.token);
                });
                console.log("تمت العملية بنجاح.");
            } catch (error) {
                console.error("خطأ:", error);
            }
        }

        triggerAutoNotification();
    </script>
</body>
</html>
